<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OneNaijaMarket</title>

  <!-- ✅ Firebase (CORRECT VERSION) -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <style>
    body { font-family: Arial; margin:0; background:#f5f5f5; }
    <h1 style="color:red;">TEST VERSION</h1>
    header { background:#008751; color:white; padding:18px; text-align:center; }
    .container { max-width:1100px; margin:20px auto; padding:12px; }
    .form-box, .listing { background:white; padding:15px; margin-bottom:15px; border-radius:12px; }
    input, textarea, select, button { width:100%; margin-top:10px; padding:10px; }
    button { background:#008751; color:white; border:none; cursor:pointer; }
    .listing img { width:100%; max-height:200px; object-fit:cover; margin-top:10px; }
    .whatsapp-btn { background:#25D366; margin-top:10px; }
  </style>
</head>

<body>

<header>
  <h1>OneNaijaMarket</h1>
  <p>Post anything. Sell anything. Offer any service.</p>
</header>

<div class="container">

  <div class="form-box">
    <h2>Post Listing</h2>
    <input id="title" placeholder="Wetin you want sell">
    
    <select id="category">
  <option>Electronics</option>
  <option>Phones & Accessories</option>
  <option>Fashion</option>
  <option>Home & Furniture</option>
  <option>Vehicles</option>
  <option>Real Estate</option>
  <option>Jobs</option>
  <option>Services</option>
  <option>Tutoring</option>
  <option>Business Opportunities</option>
  <option>Food & Catering</option>
  <option>Health & Beauty</option>
  <option>Events</option>
  <option>Others</option>
</select>

    <textarea id="description" placeholder="Description"></textarea>
    <input id="price" placeholder="Price">
    <input id="contact" placeholder="WhatsApp number (e.g. 2348012345678)">
    
    <button onclick="addListing()">Post</button>
  </div>

  <div id="listings"></div>

</div>

<script>
  // ✅ YOUR FIREBASE CONFIG (ALREADY CORRECT)
  const firebaseConfig = {
    apiKey: "AIzaSyB_M-mSkI9C_XQ8zqnL-UW9AnSSiJaI418",
    authDomain: "onenaijamarket.firebaseapp.com",
    projectId: "onenaijamarket",
    storageBucket: "onenaijamarket.firebasestorage.app",
    messagingSenderId: "505228436859",
    appId: "1:505228436859:web:5795fb2b3c280b41c089de"
  };

  // ✅ Initialize Firebase
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  // ✅ ADD LISTING
  
      function addListing() {
  const title = document.getElementById('title').value;
  const category = document.getElementById('category').value;
  const description = document.getElementById('description').value;
  const price = document.getElementById('price').value;
  const contact = document.getElementById('contact').value;

  if (!title || !description || !contact) {
    alert("Fill all required fields");
    return;
  }

  const listing = {
    title: title,
    category: category,
    description: description,
    price: price,
    contact: contact,
    createdAt: new Date()
  };

  db.collection("listings")
    .add(listing)
    .then(function() {
      alert("Posted successfully ✅");

      document.getElementById('title').value = "";
      document.getElementById('description').value = "";
      document.getElementById('price').value = "";
      document.getElementById('contact').value = "";
    })
    .catch(function(error) {
      console.error("Error adding document: ", error);
      alert("ERROR: " + error.message);
    });
}

  // ✅ RENDER LISTINGS (REAL-TIME)
  function renderListings() {
    db.collection('listings')
    
      .onSnapshot(snapshot => {
        const container = document.getElementById('listings');
        container.innerHTML = '';

        snapshot.forEach(doc => {
          const item = doc.data();

          const div = document.createElement('div');
          div.className = 'listing';

          div.innerHTML = `
            <h3>${item.title}</h3>
            <p><b>${item.category}</b></p>
            <p>${item.description}</p>
            <p><b>${item.price ? '₦' + Number(item.price).toLocaleString() : ''}</b></p>
            <a href="https://wa.me/${item.contact}" target="_blank">
              <button class="whatsapp-btn">Contact Seller</button>
            </a>
          `;

          container.appendChild(div);
        });
      });
  }

  renderListings();
</script>

</body>
</html>
