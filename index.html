<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OneNaijaMarket</title>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <style>
    body { font-family: Arial; margin:0; background:#f5f5f5; }
    header { background:#008751; color:white; padding:18px; text-align:center; }
    .container { max-width:1100px; margin:20px auto; padding:12px; }
    .form-box, .listing { background:white; padding:15px; margin-bottom:15px; border-radius:12px; }
    input, textarea, select, button { width:100%; margin-top:10px; padding:10px; }
    button { background:#008751; color:white; border:none; cursor:pointer; }
    .listing img { width:100%; max-height:200px; object-fit:cover; margin-top:10px; }
    .whatsapp-btn { background:#25D366; margin-top:10px; }
  </style>
</head>
<body><header>
  <h1>OneNaijaMarket</h1>
  <p>Post anything. Sell anything. Offer any service.</p>
</header><div class="container"><div class="form-box">
  <h2>Post Listing</h2>
  <input id="title" placeholder="Title">
  <select id="category">
    <option>Products</option>
    <option>Services</option>
    <option>Tutoring</option>
  </select>
  <textarea id="description" placeholder="Description"></textarea>
  <input id="price" placeholder="Price">
  <input id="contact" placeholder="WhatsApp number">
  <button onclick="addListing()">Post</button>
</div><div id="listings"></div></div><script>
  // 🔥 PASTE YOUR FIREBASE CONFIG HERE
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT.firebaseapp.com",
    projectId: "YOUR_PROJECT_ID",
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  function addListing() {
    const title = document.getElementById('title').value;
    const category = document.getElementById('category').value;
    const description = document.getElementById('description').value;
    const price = document.getElementById('price').value;
    const contact = document.getElementById('contact').value;

    if (!title || !description || !contact) {
      alert('Fill all fields');
      return;
    }

    db.collection('listings').add({
      title, category, description, price, contact, createdAt: Date.now()
    });
  }

  function renderListings() {
    db.collection('listings').orderBy('createdAt','desc')
      .onSnapshot(snapshot => {
        const container = document.getElementById('listings');
        container.innerHTML = '';

        snapshot.forEach(doc => {
          const item = doc.data();

          const div = document.createElement('div');
          div.className = 'listing';

          div.innerHTML = `
            <h3>${item.title}</h3>
            <p>${item.category}</p>
            <p>${item.description}</p>
            <p><b>${item.price}</b></p>
            <a href="https://wa.me/${item.contact}" target="_blank">
              <button class="whatsapp-btn">Contact</button>
            </a>
          `;

          container.appendChild(div);
        });
      });
  }

  renderListings();
</script></body>
  </html>
